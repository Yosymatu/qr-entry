name: Build Windows Release

on:
  pull_request:
    branches:
      - "main"  # 監視するブランチ
    types:
      - "closed"  # プルリクエストが閉じられたときにトリガー

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14' # プロジェクトに合わせて変更してください

    - name: Install dependencies
      run: |
        # pyproject.toml や uv.lock で管理している場合は uv sync を使用します
        uv sync 
        
        # ※もしファイルで管理しておらず手動でパッケージを入れている場合は、
        # 上の uv sync を消して以下のコマンドのコメントアウトを外してください
        # uv venv
        # uv pip install pyinstaller customtkinter polars pillow pyserial

    - name: Build EXE with PyInstaller
      run: |
        # 配布しやすいように今回は --onedir ではなく --onefile（単一ファイル化）に変更しています
        uv run pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --add-data "assets;assets" main_serial.py
      
      # 補足: もしリポジトリ内に空の data フォルダをコミットしている場合は、末尾に --add-data "data;data" を追加してください。
      # アプリ側で自動生成する作りになっているため、基本は含めなくて大丈夫です。

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QRGateChecker-Windows
        path: dist/main_serial.exe

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/qr-entry.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}