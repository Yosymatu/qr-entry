name: Build Windows Release

on:
  push:
    tags:
      - 'v*'  # 例: v1.0.0 などのタグがプッシュされたら自動実行
  workflow_dispatch:  # GitHubのActionsタブから手動で実行できるボタンを表示

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        uv sync 

    - name: Build EXE with PyInstaller
      run: |
        uv run pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --add-data "assets;assets" main_serial.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QRGateChecker-Windows
        path: dist/main_serial.exe

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/qr-entry.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}